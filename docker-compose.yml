services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: bundleai, POSTGRES_PASSWORD: bundleai, POSTGRES_DB: bundleai}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U bundleai"], interval: 3s, retries: 20}
  app:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes: {pgdata: {}}
